<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Dollar sign / Money symbol -->
  <g transform="translate(256, 256)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="16"/>
    
    <!-- Dollar symbol -->
    <text x="0" y="35" 
          text-anchor="middle" 
          font-family="Arial, sans-serif" 
          font-size="180" 
          font-weight="bold" 
          fill="white">$</text>
    
    <!-- Decorative lines -->
    <line x1="0" y1="-140" x2="0" y2="-100" stroke="rgba(255,255,255,0.5)" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="100" x2="0" y2="140" stroke="rgba(255,255,255,0.5)" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Small decorative elements -->
  <circle cx="400" cy="120" r="20" fill="rgba(255,255,255,0.3)"/>
  <circle cx="112" cy="400" r="16" fill="rgba(255,255,255,0.2)"/>
</svg>
