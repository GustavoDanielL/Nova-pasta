<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinancePro - Electron UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-900">
    <div class="max-w-6xl mx-auto p-6">
      <header class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-bold">FinancePro</h1>
        <nav>
          <button id="btn-dashboard" class="px-4 py-2 bg-blue-600 text-white rounded mr-2">Dashboard</button>
          <button id="btn-clients" class="px-4 py-2 bg-gray-200 rounded mr-2">Clientes</button>
          <button id="btn-loans" class="px-4 py-2 bg-gray-200 rounded">Empréstimos</button>
        </nav>
      </header>

      <main id="app" class="bg-white rounded shadow p-6 min-h-[60vh]">
          <!-- Login form -->
          <section id="login-view" class="max-w-md mx-auto" aria-label="Login">
            <h2 class="text-xl font-semibold mb-4">Entrar</h2>
            <form id="form-login" class="space-y-3" onsubmit="return false;">
              <label class="block">
                <span class="text-sm text-gray-600">Usuário</span>
                <input id="input-username" aria-label="Usuário" class="w-full border rounded px-3 py-2" placeholder="Usuário">
              </label>
              <label class="block">
                <span class="text-sm text-gray-600">Senha</span>
                <input id="input-password" aria-label="Senha" type="password" class="w-full border rounded px-3 py-2" placeholder="Senha">
              </label>
              <div class="flex items-center justify-between">
                <div class="text-sm text-gray-500">Login padrão: <strong>admin / admin123</strong></div>
                <div>
                  <button id="btn-login" class="px-4 py-2 bg-green-600 text-white rounded">Entrar</button>
                </div>
              </div>
            </form>
          </section>

          <!-- Global loading overlay -->
          <div id="global-spinner" class="hidden fixed inset-0 bg-black/30 flex items-center justify-center z-40">
            <div class="bg-white p-4 rounded shadow flex items-center gap-3">
              <svg class="animate-spin h-6 w-6 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
              <div class="text-sm">Aguarde... Processando</div>
            </div>
          </div>

          <!-- Clients view -->
          <section id="clients-view" class="hidden" aria-label="Clientes">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-xl font-semibold">Clientes</h2>
              <div class="flex items-center gap-3">
                <input id="client-search" class="border rounded px-3 py-2" placeholder="Buscar cliente por nome, CPF ou email">
                <button id="btn-new-client" class="px-3 py-2 bg-blue-600 text-white rounded">Novo Cliente</button>
              </div>
            </div>
            <div id="clients-list" class="space-y-2" role="list"></div>
          </section>

          <!-- Loans view -->
          <section id="loans-view" class="hidden" aria-label="Empréstimos">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-xl font-semibold">Empréstimos</h2>
              <div class="flex items-center gap-3">
                <input id="loan-search" class="border rounded px-3 py-2" placeholder="Buscar por ID ou cliente">
                <button id="btn-new-loan" class="px-3 py-2 bg-blue-600 text-white rounded">Novo Empréstimo</button>
              </div>
            </div>
            <div id="loans-list" class="space-y-2" role="list"></div>
          </section>
        </main>
    </div>

    <template id="client-row">
      <div class="p-3 border rounded flex justify-between items-center bg-white" role="listitem">
        <div>
          <div class="font-semibold name text-lg"></div>
          <div class="text-sm text-gray-500 meta"></div>
        </div>
        <div class="flex items-center">
          <span class="badge mr-3 text-sm px-2 py-1 rounded"></span>
          <button class="btn-charge px-3 py-1 bg-yellow-400 rounded mr-2">Cobrar</button>
          <button class="btn-edit px-3 py-1 bg-gray-200 rounded">Editar</button>
        </div>
      </div>
    </template>

    <template id="loan-row">
      <div class="p-3 border rounded flex justify-between items-center bg-white" role="listitem">
        <div>
          <div class="font-semibold id text-lg"></div>
          <div class="text-sm text-gray-500 meta"></div>
        </div>
        <div class="flex items-center">
          <span class="loan-badge mr-3 text-sm px-2 py-1 rounded"></span>
          <button class="btn-pay px-3 py-1 bg-green-500 text-white rounded mr-2">Registrar Pagamento</button>
          <button class="btn-details px-3 py-1 bg-gray-200 rounded">Detalhes</button>
        </div>
      </div>
    </template>

    <!-- Modals -->
    <div id="modal-root"></div>

    <!-- Toasts -->
    <div id="toasts" class="fixed bottom-6 right-6 space-y-2 z-50"></div>

    <script src="renderer.js"></script>
  </body>
</html>
